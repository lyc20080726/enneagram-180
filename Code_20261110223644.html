<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>九型人格测试（180题）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#2b2f38;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 90px}

.bar .info{flex:1;font-size:13px;color:#6b7280}
.pbar{height:6px;background:#e6e9f0;border-radius:3px;overflow:hidden;margin-bottom:12px}

.qno{font-size:13px;color:#8a63f5;font-weight:700;letter-spacing:.5px}
.qtext{font-size:19px;margin:6px 0 18px;font-weight:500}

.opts button b{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#fff;border:1px solid #c7cddb;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#6b7280}
.opts button.on{border-color:#4f6ef7;background:#eef3ff}
.opts button.on b{background:#4f6ef7;color:#fff;border-color:#4f6ef7}

.nav button{background:none;border:none;color:#4f6ef7;font-size:15px;padding:8px 4px;cursor:pointer}

.score-hero{text-align:center;padding:8px 0 4px}
.badge{display:inline-flex;align-items:center;justify-content:center;line-height:1;background:linear-gradient(135deg,#4f6ef7,#8a63f5);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:700}
.score-hero .n{font-size:40px;font-weight:800;color:#1f2d4d;margin:8px 0 0}
.score-hero .n small{font-size:14px;color:#9aa1b1;font-weight:400}
.core{font-style:italic;color:#8a63f5;font-size:15px;margin:10px 0 0}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0;color:#4b5563}
.row span:first-child{flex:0 0 64px;color:#9aa1b1}
.rank{margin:8px 0}
.rank .head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.rank .track{height:9px;background:#eef0f6;border-radius:5px;overflow:hidden}
.rank .track i{display:block;height:100%;border-radius:5px;background:#c7d0f5}
.rank.top .head b{color:#4f6ef7}
.rank.top .track i{background:linear-gradient(90deg,#4f6ef7,#8a63f5)}
.sec{margin-top:14px}
.sec h3{font-size:15px;margin:0 0 6px;color:#1f2d4d}
.sec p{margin:0;font-size:14px;color:#4b5563}
.note{font-size:12px;color:#9aa1b1;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="intro">
  <div class="card">
    <h1>九型人格测试</h1>
    <p class="sub">共 180 题 · 约 20–30 分钟 · 手机即可完成</p>
    <div class="tip">
      <b>答题说明</b><br>
      1. 只选与你真实的思想或行为<b>非常吻合</b>的描述；模棱两可、偶尔出现的不要选。<br>
      2. 选的是“真实的我”，不是“我喜欢的我”。<br>
      3. 不要前思后想，第一感觉更准。<br>
      4. 结果无好坏之分，每种类型都有独特价值。
    </div>
    <button class="btn" onclick="start()">开始测试</button>
  </div>
</div>

<div id="quiz" class="hide">
  <div class="card">
    <div class="pbar"><i id="pfill"></i></div>
    <div class="qno" id="qno"></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts">
      <button data-v="1" onclick="pick(1)"><b>A</b><span>符合我</span></button>
      <button data-v="0" onclick="pick(0)"><b>B</b><span>不符合 / 不确定</span></button>
    </div>
    <div class="nav">
      <button onclick="go(-1)" id="prev">← 上一题</button>
      <button onclick="go(1)" id="next">下一题 →</button>
    </div>
  </div>
</div>

<div id="result" class="hide"></div>

</div>

<div class="bar hide" id="bar">
  <div class="info" id="barinfo"></div>
  <button class="btn ghost" style="width:auto;margin:0;padding:10px 16px" onclick="finish()">交卷看结果</button>
</div>

<script>

const N = DATA.questions.length;
let ans = new Array(N).fill(null), cur = 0;
try{ const s = JSON.parse(localStorage.getItem('enn180')||'{}'); if(s.ans&&s.ans.length===N) ans=s.ans; }catch(e){}
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem('enn180', JSON.stringify({ans,cur})); }
function show(id){ ['intro','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id)); $('bar').classList.toggle('hide', id!=='quiz'); }
function start(){ show('quiz'); render(); }
function render(){
  $('pfill').style.width = (ans.filter(x=>x!==null).length/N*100)+'%';
  $('qno').textContent = '第 '+(cur+1)+' / '+N+' 题';
  $('qtext').textContent = DATA.questions[cur];
  document.querySelectorAll('.opts button').forEach(b=>{
    b.classList.toggle('on', ans[cur]===Number(b.dataset.v));
  });
  $('prev').disabled = cur===0;
  $('next').disabled = cur===N-1;
  $('barinfo').textContent = '已答 '+ans.filter(x=>x!==null).length+' / '+N+' 题';
  window.scrollTo({top:0,behavior:'smooth'});
  save();
}
function pick(v){ ans[cur]=v; if(cur<N-1 && v===1){ setTimeout(()=>{ if(cur<N-1){cur++;render();} },180); } else render(); }
function go(d){ cur=Math.max(0,Math.min(N-1,cur+d)); render(); }
function finish(){
  const left = ans.map((x,i)=>x===null?i+1:0).filter(Boolean);
  if(left.length){ alert('还有 '+left.length+' 题未作答（如第 '+left.slice(0,5).join('、')+' 题…）。\n未答按“不符合”计，确定交卷吗？'); }
  compute(); show('result'); window.scrollTo({top:0});
}
function compute(){
  const sc = {}; for(let i=1;i<=9;i++) sc[i]=0;
  ans.forEach((a,i)=>{ if(a===1) sc[DATA.mapping[i+1]]++; });
  const rank = Object.keys(sc).map(Number).sort((a,b)=>sc[b]-sc[a]||a-b);
  const main = rank[0], t = DATA.types[main];
  const max = sc[rank[0]]||1;
  let h = '<div class="card"><div class="score-hero"><div class="badge">主型号 '+main+' 号 · '+t.name+'</div>'
    + '<div class="n">'+sc[main]+'<small> / 20 分</small></div>'
    + '<p class="core">'+t.core+'</p></div>'
    + '<div class="tip">欲望特质：'+t.desire+'　｜　'+t.en+'</div>';
  h += '<div class="sec"><h3>九型得分分布</h3>';
  rank.forEach(i=>{
    h += '<div class="rank'+(i===main?' top':'')+'"><div class="head"><b>'+i+' 号 '+DATA.types[i].name+'</b><span>'+sc[i]+' 分</span></div>'
      + '<div class="track"><i style="width:'+(sc[i]/max*100)+'%"></i></div></div>';
  });
  h += '</div>';
  const second = rank[1];
  if(sc[second]>=sc[main]-2 && sc[second]>=12){
    h += '<div class="tip">你的 '+second+' 号（'+DATA.types[second].name+'）得分为 '+sc[second]+'，与主型接近，可能存在<b>侧翼</b>影响，可一并参考其解析。</div>';
  }
  const f = (label,txt)=> txt? '<div class="row"><span>'+label+'</span><span>'+txt+'</span></div>':'';
  h += '<div class="sec"><h3>类型解析</h3>'
    + f('主要特征',t.traits)+f('主要特质',t.gift)+f('生活风格',t.style)+f('成长建议',t.growth)+'</div>';
  if(second!==main) h += '<div class="sec"><h3>参考：'+second+' 号 '+DATA.types[second].name+'</h3><p>'+DATA.types[second].traits+'</p></div>';
  h += '<p class="note">本测试基于你勾选的句子按原量表计分（每型 20 题）。结果仅供自我探索参考，并非诊断；状态变化会影响作答。</p>'
    + '<button class="btn ghost" onclick="localStorage.removeItem(\'enn180\');location.reload()">重新测试</button></div>';
  $('result').innerHTML = h;
}
document.addEventListener('keydown',e=>{ if($('quiz').classList.contains('hide'))return;
  if(e.key==='a'||e.key==='A')pick(1); if(e.key==='b'||e.key==='B')pick(0);
  if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); });
$('next').onclick=()=>go(1);
</script>
